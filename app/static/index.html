<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MobileNetV2 Image Classifier</title>
<style>
  :root {
    --bg: #121417;
    --panel: #1b1e23;
    --panel-2: #22262c;
    --border: #2e333a;
    --text: #f2f3f5;
    --muted: #9aa1ab;
    --accent: #4d8dff;
    --green: #33c07a;
    --yellow: #e6c229;
    --red: #e2543b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
    max-width: 640px;
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 1.7rem;
    font-weight: 600;
  }
  .status-line {
    font-size: 0.9rem;
    color: var(--muted);
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .dot.ok { background: var(--green); }
  .dot.bad { background: var(--red); }

  main {
    width: 100%;
    max-width: 640px;
  }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    background: var(--panel);
    padding: 48px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone.dragover {
    border-color: var(--accent);
    background: #1a2333;
  }
  .dropzone p {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
  }
  .dropzone .icon {
    font-size: 2rem;
    margin-bottom: 12px;
    display: block;
  }
  input[type="file"] { display: none; }

  .preview-wrap {
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  .preview-wrap img {
    max-width: 100%;
    max-height: 280px;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  .spinner {
    margin: 20px auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    display: none;
  }
  .results.error {
    border-color: var(--red);
  }
  .error-message {
    color: var(--red);
    font-size: 0.95rem;
    text-align: center;
    margin: 0;
  }

  .top-result {
    text-align: center;
    margin-bottom: 24px;
  }
  .top-result .class-name {
    font-size: 2rem;
    font-weight: 700;
    text-transform: capitalize;
    margin: 0;
  }
  .top-result .confidence {
    font-size: 1.1rem;
    color: var(--muted);
    margin: 4px 0 0;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .bar-label {
    width: 90px;
    flex-shrink: 0;
    font-size: 0.9rem;
    text-transform: capitalize;
    color: var(--text);
  }
  .bar-track {
    flex: 1;
    background: var(--panel-2);
    border-radius: 8px;
    height: 20px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 0.4s ease;
  }
  .bar-fill.green { background: var(--green); }
  .bar-fill.yellow { background: var(--yellow); }
  .bar-fill.red { background: var(--red); }
  .bar-pct {
    width: 52px;
    flex-shrink: 0;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: right;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }

  footer {
    margin-top: 32px;
    text-align: center;
  }
  button#reload-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button#reload-btn:hover { background: var(--border); }
  button#reload-btn:disabled { opacity: 0.5; cursor: default; }
  #reload-msg {
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 1.2em;
  }

  @media (max-width: 480px) {
    .dropzone { padding: 32px 12px; }
    .top-result .class-name { font-size: 1.6rem; }
    .bar-label { width: 70px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>MobileNetV2 Image Classifier</h1>
  <div class="status-line" id="status-line">Loading status…</div>
</header>

<main>
  <div class="dropzone" id="dropzone">
    <span class="icon">📷</span>
    <p>Drag &amp; drop an image here<br>or click to upload</p>
    <input type="file" id="file-input" accept=".jpg,.jpeg,.png">
  </div>

  <div class="preview-wrap" id="preview-wrap">
    <img id="preview-img" alt="Uploaded preview">
  </div>

  <div class="spinner" id="spinner"></div>

  <div class="results" id="results">
    <div id="results-content"></div>
  </div>
</main>

<footer>
  <button id="reload-btn">Reload Model</button>
  <div id="reload-msg"></div>
</footer>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const previewWrap = document.getElementById('preview-wrap');
const previewImg = document.getElementById('preview-img');
const spinner = document.getElementById('spinner');
const results = document.getElementById('results');
const resultsContent = document.getElementById('results-content');
const statusLine = document.getElementById('status-line');
const reloadBtn = document.getElementById('reload-btn');
const reloadMsg = document.getElementById('reload-msg');

function barColor(pct) {
  if (pct > 70) return 'green';
  if (pct >= 30) return 'yellow';
  return 'red';
}

function renderStatus(health) {
  if (!health) {
    statusLine.innerHTML = '<span class="dot bad"></span>Unable to reach server';
    return;
  }
  if (health.model_loaded) {
    statusLine.innerHTML =
      '<span class="dot ok"></span>Model v' + health.model_version + ' loaded' +
      ' &middot; uptime ' + Math.round(health.uptime_seconds) + 's';
  } else {
    statusLine.innerHTML = '<span class="dot bad"></span>No model loaded yet';
  }
}

async function fetchHealth() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    renderStatus(data);
    return data;
  } catch (e) {
    renderStatus(null);
    return null;
  }
}

function renderError(message) {
  results.classList.add('error');
  results.style.display = 'block';
  resultsContent.innerHTML = '<p class="error-message">' + message + '</p>';
}

function renderResults(data) {
  results.classList.remove('error');
  results.style.display = 'block';

  const topPct = (data.confidence * 100).toFixed(1);
  let html = '';
  html += '<div class="top-result">';
  html += '  <p class="class-name">' + data.class_name + '</p>';
  html += '  <p class="confidence">' + topPct + '% confidence</p>';
  html += '</div>';

  data.top_3_predictions.forEach(function (p) {
    const pct = (p.confidence * 100).toFixed(1);
    const color = barColor(parseFloat(pct));
    html += '<div class="bar-row">';
    html += '  <div class="bar-label">' + p.class_name + '</div>';
    html += '  <div class="bar-track"><div class="bar-fill ' + color + '" style="width:' + pct + '%"></div></div>';
    html += '  <div class="bar-pct">' + pct + '%</div>';
    html += '</div>';
  });

  html += '<div class="meta-row">';
  html += '  <span>Inference: ' + data.inference_time_ms.toFixed(1) + ' ms</span>';
  html += '  <span>Model v' + data.model_version + '</span>';
  html += '</div>';

  resultsContent.innerHTML = html;
}

async function uploadFile(file) {
  const reader = new FileReader();
  reader.onload = function (e) {
    previewImg.src = e.target.result;
    previewWrap.style.display = 'block';
  };
  reader.readAsDataURL(file);

  results.style.display = 'none';
  spinner.style.display = 'block';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/predict', { method: 'POST', body: formData });
    spinner.style.display = 'none';

    if (res.status === 503) {
      renderError('Model not loaded yet — train and register a model first.');
      return;
    }
    if (!res.ok) {
      const err = await res.json().catch(function () { return {}; });
      renderError(err.detail || ('Request failed (' + res.status + ')'));
      return;
    }

    const data = await res.json();
    renderResults(data);
    fetchHealth();
  } catch (e) {
    spinner.style.display = 'none';
    renderError('Could not reach the server.');
  }
}

dropzone.addEventListener('click', function () { fileInput.click(); });

fileInput.addEventListener('change', function () {
  if (fileInput.files.length > 0) uploadFile(fileInput.files[0]);
});

['dragenter', 'dragover'].forEach(function (evt) {
  dropzone.addEventListener(evt, function (e) {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
});

['dragleave', 'drop'].forEach(function (evt) {
  dropzone.addEventListener(evt, function (e) {
    e.preventDefault();
    dropzone.classList.remove('dragover');
  });
});

dropzone.addEventListener('drop', function (e) {
  const files = e.dataTransfer.files;
  if (files.length > 0) uploadFile(files[0]);
});

reloadBtn.addEventListener('click', async function () {
  reloadBtn.disabled = true;
  reloadMsg.textContent = 'Reloading…';
  try {
    const res = await fetch('/reload-model', { method: 'POST' });
    const data = await res.json().catch(function () { return {}; });
    if (res.ok) {
      reloadMsg.textContent = 'Reloaded — now serving version ' + data.version;
    } else {
      reloadMsg.textContent = data.detail || 'Reload failed';
    }
  } catch (e) {
    reloadMsg.textContent = 'Could not reach the server.';
  }
  await fetchHealth();
  reloadBtn.disabled = false;
});

fetchHealth();
</script>

</body>
</html>
